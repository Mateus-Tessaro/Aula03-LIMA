<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UFT-8">
        <title>Exemplos 2 - Tabelas</title>
    </head>
    <body>
        <header>
            <h1 style ="text-align: center; color: red;">Almoço no SESI</h1>
            <hr>
        </header>
        <main>
            <!--Iniciando Tabela-->
            <table border="2" style="width: 100%;">
                <!--Titulo da Tabela-->
                <caption>Comidas do SESI</caption>
                <!--Cabeçalho da Tabela-->
                <thead>
                    <!--Primeira linha do cabeçalho-->
                    <tr>
                        <th colspan="6">Dias da Semana</th>
                    </tr>
                    <!--Segunda linha do cabeçalho-->
                    <tr>
                        <th>Informações</th>
                        <th>Segunda-Feira</th>
                        <th>Terça-Feira</th>
                        <th>Quarta-Feira</th>
                        <th>Quinta-Feira</th>
                        <th>Sexta-Feira</th>
                    </tr>
                </thead>
                <!--Corpo da Tabela-->
                <tbody>
                    <tr>
                        <th rowspan="2" style="background-image: url('https://gifdb.com/images/branded/high/cmy-color-gradient-fade-5ofu5wqnm7texgrm.gif');">Informações Nutricionais</th>
                        <th colspan="5">Arroz + Feijão</th>
                    </tr>
                    <!--Segunda linha do corpo da Tabela-->
                    <tr>
                        <td>Carne</td>
                        <td>Feijoada</td>
                        <td>Goulash</td>
                        <td>Moela</td>
                        <td>Pé de frango</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
